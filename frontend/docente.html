<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectiva · Panel docente</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/docente.css">
</head>
<body class="docente-body">
  <section id="doc-login" class="doc-login" aria-labelledby="doc-login-titulo">
    <div class="doc-card">
      <h1 id="doc-login-titulo">Lectiva</h1>
      <p class="doc-muted">Panel docente · Ingresa la contraseña del docente</p>
      <input type="password" id="doc-password" placeholder="Contraseña" aria-label="Contraseña del docente" autocomplete="current-password">
      <button class="btn btn-primary" id="doc-login-btn">Entrar</button>
      <p id="doc-login-error" class="error-message" role="alert" style="display:none;"></p>
    </div>
  </section>

  <div id="doc-panel" class="doc-panel" style="display:none;">
    <header class="doc-header">
      <button type="button" class="btn btn-secondary doc-menu-btn" id="doc-menu-btn" aria-expanded="false" aria-controls="doc-nav">☰ Menú</button>
      <div class="doc-marca"><strong id="doc-marca">Panel docente</strong><span class="doc-muted">Lectiva · Panel docente <span id="doc-version"></span></span></div>
      <div id="doc-contexto" class="doc-contexto" role="group" aria-label="Grupo y materia" hidden>
        <div class="doc-ctx-campo"><span class="doc-ctx-etiqueta" id="ctx-seccion-et">Grupo</span><div class="doc-seg" id="ctx-seccion" role="radiogroup" aria-labelledby="ctx-seccion-et"></div></div>
        <div class="doc-ctx-campo"><span class="doc-ctx-etiqueta" id="ctx-periodo-et">Período</span><div class="doc-seg" id="ctx-periodo" role="radiogroup" aria-labelledby="ctx-periodo-et"></div></div>
        <label class="doc-ctx-campo doc-ctx-materia"><span class="doc-ctx-etiqueta">Materia</span><select id="ctx-materia"></select></label>
      </div>
      <div class="doc-header-acciones">
        <span id="doc-sesion" class="doc-muted"></span>
        <button type="button" class="tema-btn" aria-label="Cambiar tema"></button>
        <button class="btn btn-secondary" id="doc-logout">Salir</button>
      </div>
    </header>
    <div id="doc-aviso-clave" class="doc-aviso-error" role="alert" hidden>
      <span><strong>Estás usando la contraseña de fábrica.</strong> Es pública (está en el código del proyecto): cámbiala para proteger las notas.</span>
      <button type="button" class="btn btn-primary" id="doc-aviso-clave-btn">Cambiar ahora</button>
    </div>
    <div class="doc-cuerpo">
      <nav id="doc-nav" class="doc-nav" aria-label="Secciones del panel"></nav>
      <div id="doc-nav-fondo" class="doc-nav-fondo" hidden></div>
      <main id="doc-contenido"></main>
    </div>
  </div>

  <div id="doc-toasts" class="doc-toasts" aria-live="polite"></div>

  <script src="/js/docente/core.js"></script>
  <script src="/js/docente/fichas.js"></script>
  <script src="/js/docente/resumen.js"></script>
  <script src="/js/docente/resultados.js"></script>
  <script src="/js/docente/estudiantes.js"></script>
  <script src="/js/docente/examenes.js"></script>
  <script src="/js/docente/asistencia.js"></script>
  <script src="/js/docente/actividades.js"></script>
  <script src="/js/docente/notas.js"></script>
  <script src="/js/docente/reportes.js"></script>
  <script src="/js/docente/bitacora.js"></script>
  <script src="/js/docente/ajustes.js"></script>
</body>
</html>
